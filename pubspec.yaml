name: dotdotdot_ai
description: Local-first multi-provider AI studio — chat, media, projects, nested plans, optional Google Drive sync.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  intl: ^0.20.2
  collection: ^1.19.1
  sembast: ^3.8.5+1
  sembast_web: ^2.4.1
  file_picker: ^8.3.7
  google_sign_in: ^6.3.0
  googleapis: ^14.0.0
  googleapis_auth: ^1.6.0
  http: ^1.3.0
  crypto: ^3.0.6
  encrypt: ^5.0.3
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/models.json
